# seeds/config.yml
# -----------------
# Configuración centralizada de retos.
# Modifica este fichero para controlar qué retos se insertan al arrancar
# el contenedor y cuáles están visibles para los participantes.
#
# Campos:
#   enabled : true  → el reto se inserta en BD al arrancar Docker
#             false → el reto se OMITE completamente al arrancar
#   state   : visible → visible para los participantes
#             hidden  → existe en BD pero los participantes no lo ven
#             (solo tiene efecto si enabled: true)

challenges:
  sqli_login:
    enabled: true
    state: visible

  # Plantilla para futuros retos — descomenta y rellena:
